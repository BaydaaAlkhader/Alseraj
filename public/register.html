<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>السراج - إنشاء حساب جديد</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <div class="mosque-icon">🕌</div>
      <h2>إنشاء حساب جديد</h2>
      <p class="subtitle">ابدأ رحلتك معنا في طلب العلم والأثر</p>
    </div>

    <!-- نموذج التسجيل -->
    <form id="registerForm">
      <div class="input-group">
        <label>الاسم الكامل</label>
        <input type="text" id="name" placeholder="أدخل اسمك الكامل" required>
      </div>

      <div class="input-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required>
      </div>

      <div class="input-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
      </div>

      <!-- مكان عرض الرسائل والخُطأ -->
      <div id="errorMessage" class="error-msg"></div>
      <div id="successMessage" class="success-msg"></div>

      <button type="submit" class="btn-submit">إنشاء حساب</button>
    </form>

    <p class="switch-auth">
      لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
    </p>
  </div>

  <script src="register.js"></script>
</body>
</html>
